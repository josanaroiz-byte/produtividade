<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Produtividade Integrado</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="app-icon"></div>
            <h1>Portal de Produtividade</h1>
        </header>

        <nav role="tablist" aria-label="Navegação principal">
            <button 
                class="tab-btn active" 
                data-tab="casa" 
                role="tab" 
                aria-selected="true" 
                aria-controls="casa"
                tabindex="0">
                CASA
            </button>
            <button 
                class="tab-btn" 
                data-tab="trabalho" 
                role="tab" 
                aria-selected="false" 
                aria-controls="trabalho"
                tabindex="-1">
                TRABALHO
            </button>
            <button 
                class="tab-btn" 
                data-tab="financas" 
                role="tab" 
                aria-selected="false" 
                aria-controls="financas"
                tabindex="-1">
                FINANÇAS
            </button>
        </nav>

        <!-- ABA CASA -->
        <section id="casa" class="panel active" role="tabpanel" aria-labelledby="casa-tab">
            <h2>Minhas Tarefas</h2>
            <div class="input-group">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="O que você precisa fazer hoje?"
                    aria-label="Nova tarefa">
                <button class="btn-action btn-add" id="addTodoBtn">Adicionar</button>
            </div>
            <div id="todoList" role="list"></div>
            <div id="todoEmpty" class="empty-message" style="display: none;">
                Nenhuma tarefa. Comece adicionando uma! ✨
            </div>
        </section>

        <!-- ABA TRABALHO -->
        <section id="trabalho" class="panel" role="tabpanel" aria-labelledby="trabalho-tab">
            <div class="work-tools">
                <h2>Notas de Trabalho</h2>
                <div class="timer-display" id="timerDisplay" aria-label="Timer">25:00</div>
            </div>
            <div class="work-tools">
                <span id="wordCount" aria-live="polite">Palavras: 0</span>
                <div class="button-group">
                    <button class="tab-btn" id="timerBtn">Iniciar Timer</button>
                    <button class="tab-btn btn-reset" id="resetBtn">Reset</button>
                </div>
            </div>
            <textarea 
                id="noteEditor" 
                placeholder="Escreva suas ideias..."
                aria-label="Editor de notas"></textarea>
        </section>

        <!-- ABA FINANÇAS -->
        <section id="financas" class="panel" role="tabpanel" aria-labelledby="financas-tab">
            <h2>Gestão Financeira</h2>
            <div class="finance-tabs" role="tablist">
                <button 
                    class="tab-btn active" 
                    data-finance-tab="fluxo" 
                    role="tab" 
                    aria-selected="true" 
                    aria-controls="fluxo">
                    Fluxo de Caixa
                </button>
                <button 
                    class="tab-btn" 
                    data-finance-tab="calc" 
                    role="tab" 
                    aria-selected="false" 
                    aria-controls="calc">
                    Simulador Renda Fixa
                </button>
            </div>

            <!-- Fluxo de Caixa -->
            <div id="fluxo" class="finance-content active" role="tabpanel">
                <input 
                    type="text" 
                    id="finDesc" 
                    placeholder="Descrição (Ex: Salário, Mercado)"
                    aria-label="Descrição da transação">
                <input 
                    type="number" 
                    id="finValue" 
                    placeholder="Valor (R$) - Use sinal de menos para gastos"
                    aria-label="Valor da transação">
                <button class="btn-action" id="addFinanceBtn">Lançar Valor</button>
                <div id="financeList" role="list"></div>
                <div id="financeEmpty" class="empty-message" style="display: none;">
                    Nenhuma transação registrada. Comece adicionando! 💰
                </div>
                <div class="balance-box" id="balanceDisplay" aria-live="polite">Saldo: R$ 0,00</div>
            </div>

            <!-- Calculadora -->
            <div id="calc" class="finance-content" role="tabpanel">
                <label for="calcInit">Investimento Inicial (R$)</label>
                <input type="number" id="calcInit" value="1000" aria-label="Investimento inicial">
                
                <label for="calcMonthly">Aporte Mensal (R$)</label>
                <input type="number" id="calcMonthly" value="100" aria-label="Aporte mensal">
                
                <label for="calcRate">Taxa de Juros (% ao ano)</label>
                <input type="number" id="calcRate" value="12" aria-label="Taxa de juros anual">
                
                <label for="calcTime">Tempo (Meses)</label>
                <input type="number" id="calcTime" value="12" aria-label="Tempo em meses">
                
                <button class="btn-action" id="calculateBtn">Calcular Rendimento</button>
                <div class="balance-box" id="calcResult" aria-live="polite">---</div>
            </div>
        </section>
    </div>

    <footer>
        Elaborado por Josana Roiz · @josanaroiz
    </footer>

    <!-- Notificação Toast -->
    <div id="notification" class="notification" role="alert" aria-live="assertive"></div>

    <script src="script.js"></script>
</body>
</html>
